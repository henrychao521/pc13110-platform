<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>家政 3DGS · 光線時光機（在真實場景上改天色）</title>
<style>
  html,body{margin:0;height:100%;overflow:hidden;background:#000;font-family:-apple-system,"PingFang TC",system-ui;touch-action:none}
  #stage{position:fixed;inset:0}
  #c{position:absolute;inset:0;width:100%;height:100%;display:block;transition:filter .25s}
  /* 調色疊層(blend 到 3DGS 畫面) */
  #grade{position:absolute;inset:0;pointer-events:none;mix-blend-mode:multiply;transition:background .25s,opacity .25s}
  #glow{position:absolute;inset:0;pointer-events:none;mix-blend-mode:screen;opacity:0;transition:opacity .25s;
        background:radial-gradient(120% 80% at 50% 80%, rgba(255,210,150,.9), rgba(255,210,150,0) 60%)}
  #panel{position:fixed;left:12px;right:12px;bottom:12px;z-index:10;background:rgba(11,14,20,.86);backdrop-filter:blur(8px);
         border:1px solid #232a36;border-radius:14px;padding:12px 16px;color:#e6edf3;max-width:680px;margin:0 auto}
  #panel .top{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
  #panel .tt{font-weight:800;font-size:15px} #panel .v{color:#ffd34e;font-variant-numeric:tabular-nums}
  #time{flex:1;min-width:160px;height:24px} input[type=range]{width:100%}
  .ctls{display:flex;gap:12px;flex-wrap:wrap;align-items:center;margin-top:8px;font-size:12.5px;color:#8b97a7}
  .ctls input[type=date],.ctls select,.ctls input[type=number]{background:#0d1117;border:1px solid #232a36;color:#e6edf3;border-radius:7px;padding:4px 7px;font-size:12.5px}
  .ctls .bear{flex:1;min-width:140px}
  .pill{background:#1b2230;border:1px solid #2b3445;border-radius:20px;padding:4px 12px;cursor:pointer;color:#cfd6e6;font-size:12.5px}
  #sum{font-size:12px;color:#9aa3b5;margin-top:6px} #sum b{color:#fff}
  #load{position:fixed;inset:0;z-index:20;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:10px;background:#05070c;color:#e6edf3}
  #bar{width:min(420px,70vw);height:8px;background:#222;border-radius:4px;overflow:hidden}#fill{height:100%;width:0;background:#ffd34e}
  .hint{position:fixed;top:10px;left:50%;transform:translateX(-50%);z-index:10;color:#cfd6e6;background:rgba(11,14,20,.7);
        padding:5px 12px;border-radius:18px;font-size:12px}
</style></head>
<body>
<div id="stage"><canvas id="c"></canvas><div id="grade"></div><div id="glow"></div></div>
<div class="hint">拖曳轉視角 · WASD 移動 · 下方時間拉桿改天色光線</div>
<div id="panel">
  <div class="top"><span class="tt">🕰️ <span class="v" id="timeV">—</span></span>
    <input type="range" id="time" min="0" max="1439" step="5">
    <span class="pill" id="playBtn">▶ 一日</span><span class="pill" id="nowBtn">現在</span></div>
  <div class="ctls">
    <label>日期 <input type="date" id="date"></label>
    <label>天氣 <select id="wx"><option value="clear">晴</option><option value="partly">多雲</option><option value="overcast">陰</option></select></label>
    <label class="bear">窗向 <span class="v" id="bearV">88</span>° <input type="range" id="bear" min="0" max="359" value="88"></label>
  </div>
  <div id="sum"></div>
</div>
<div id="load"><div>載入家政 3DGS 場景…</div><div id="bar"><div id="fill"></div></div><div id="pct" style="font-size:12px;color:#8b97a7"></div></div>
<script type="module">
import * as pc from 'https://cdn.jsdelivr.net/npm/playcanvas@2.10.1/build/playcanvas.mjs';
const XF={scale:0.92096,quat:[0.968077,0.041165,0.220993,-0.110881],pos:[-0.9518,0.4481,-3.6527]};
const FLOOR_Y=-0.457,EYE=1.0,SPAWN=[-1.924,-2.057];
const ASSET='https://henrychao521.github.io/x5-roomtour-viewer/assets/homeec_8k_walk.compressed.ply';
const $=id=>document.getElementById(id);
const canvas=$('c');
const app=new pc.Application(canvas,{mouse:new pc.Mouse(canvas),keyboard:new pc.Keyboard(window),
  graphicsDeviceOptions:{antialias:false,preserveDrawingBuffer:true}});
app.setCanvasFillMode(pc.FILLMODE_FILL_WINDOW);app.setCanvasResolution(pc.RESOLUTION_AUTO);
addEventListener('resize',()=>app.resizeCanvas());app.start();
const cam=new pc.Entity();cam.addComponent('camera',{clearColor:new pc.Color(0.5,0.6,0.7),fov:75,nearClip:0.04,farClip:120});
cam.setPosition(SPAWN[0],FLOOR_Y+EYE,SPAWN[1]);app.root.addChild(cam);
// 載入 splat
(async()=>{
  try{
    const res=await fetch(ASSET);const total=+res.headers.get('Content-Length')||24000000;
    const rd=res.body.getReader();const ch=[];let got=0;
    while(true){const{done,value}=await rd.read();if(done)break;ch.push(value);got+=value.length;
      const p=Math.min(100,Math.round(got/total*100));$('fill').style.width=p+'%';$('pct').textContent=p+'%（'+(got/1048576).toFixed(1)+'MB）';}
    const url=URL.createObjectURL(new Blob(ch));
    const asset=new pc.Asset('he','gsplat',{url,filename:'s.compressed.ply'});
    asset.on('load',()=>{const e=new pc.Entity();e.addComponent('gsplat',{asset});
      e.setLocalScale(XF.scale,XF.scale,XF.scale);e.setLocalRotation(new pc.Quat(XF.quat[0],XF.quat[1],XF.quat[2],XF.quat[3]));
      e.setLocalPosition(XF.pos[0],XF.pos[1],XF.pos[2]);app.root.addChild(e);$('load').style.display='none';render();});
    asset.on('error',err=>$('pct').textContent='載入失敗:'+err);app.assets.add(asset);app.assets.load(asset);
  }catch(e){$('pct').textContent='錯誤:'+e.message;}
})();
// 視角:拖曳look + WASD
let yaw=180,pitch=0,drag=false,lx=0,ly=0;
canvas.addEventListener('pointerdown',e=>{drag=true;lx=e.clientX;ly=e.clientY;});
addEventListener('pointerup',()=>drag=false);
addEventListener('pointermove',e=>{if(!drag)return;yaw-=(e.clientX-lx)*0.2;pitch=Math.max(-85,Math.min(85,pitch-(e.clientY-ly)*0.2));lx=e.clientX;ly=e.clientY;});
app.on('update',dt=>{cam.setEulerAngles(pitch,yaw,0);const kb=app.keyboard;let f=0,s=0;
  if(kb.isPressed(pc.KEY_W))f+=1;if(kb.isPressed(pc.KEY_S))f-=1;if(kb.isPressed(pc.KEY_A))s-=1;if(kb.isPressed(pc.KEY_D))s+=1;
  if(f||s){const fw=cam.forward,r=cam.right,sp=1.8*dt;const p=cam.getPosition();
    cam.setPosition(p.x+(fw.x*f+r.x*s)*sp,p.y+(fw.y*f)*sp,p.z+(fw.z*f+r.z*s)*sp);}});
// ===== 光線模型 =====
function solar(lat,lon,dt,tz){const N=Math.floor((dt-new Date(dt.getFullYear(),0,0))/864e5),h=dt.getHours()+dt.getMinutes()/60;
  const dc=23.45*Math.sin(2*Math.PI/365*(N-81)),Bx=2*Math.PI/364*(N-81),Eo=9.87*Math.sin(2*Bx)-7.53*Math.cos(Bx)-1.5*Math.sin(Bx);
  const TC=4*(lon-15*tz)+Eo,LST=h+TC/60,HRA=15*(LST-12),lr=lat*Math.PI/180,dr=dc*Math.PI/180,hr=HRA*Math.PI/180;
  const el=Math.asin(Math.sin(dr)*Math.sin(lr)+Math.cos(dr)*Math.cos(lr)*Math.cos(hr))*180/Math.PI;
  let ca=(Math.sin(dr)*Math.cos(lr)-Math.cos(dr)*Math.sin(lr)*Math.cos(hr))/Math.max(1e-6,Math.cos(el*Math.PI/180));
  let az=Math.acos(Math.max(-1,Math.min(1,ca)))*180/Math.PI;if(HRA>0)az=360-az;return{el,az};}
function daylight(el,wx){if(el<=-0.5)return{Egh:0,Edir:0,cct:0};const s=Math.sin(Math.max(0,el)*Math.PI/180);
  let Egh=96*s,Edir=105*s,cct=4000+2600*Math.min(1,s/0.9);
  if(wx==='partly'){Edir*=0.5;Egh*=0.8;}if(wx==='overcast'){Edir=0;Egh*=0.45;cct=6800;}return{Egh,Edir,cct};}
function lc(a,b,t){return[a[0]+(b[0]-a[0])*t|0,a[1]+(b[1]-a[1])*t|0,a[2]+(b[2]-a[2])*t|0];}
function sky(el,wx){let top,bot;
  if(el>=10){top=[58,116,196];bot=[150,188,226];}
  else if(el>=0){const t=el/10;top=lc([70,70,130],[58,116,196],t);bot=lc([250,150,80],[150,188,226],t);}
  else if(el>=-6){const t=(el+6)/6;top=lc([35,38,80],[70,70,130],t);bot=lc([225,110,70],[250,150,80],t);}
  else if(el>=-12){const t=(el+12)/6;top=lc([12,14,34],[35,38,80],t);bot=lc([45,42,80],[225,110,70],t);}
  else{top=[8,10,26];bot=[16,18,42];}
  if(wx==='overcast'){const g=v=>[(v[0]+150)/2|0,(v[1]+150)/2|0,(v[2]+155)/2|0];top=g(top);bot=g(bot);}return{top,bot};}
function dn(az){return['北','東北','東','東南','南','西南','西','西北'][Math.round(az/45)%8];}
function render(){
  const d=new Date($('date').value+'T00:00');const m=+$('time').value;d.setHours(m/60|0,m%60,0,0);
  const bear=+$('bear').value,wx=$('wx').value;$('timeV').textContent=String(m/60|0).padStart(2,'0')+':'+String(m%60).padStart(2,'0');$('bearV').textContent=bear;
  const {el,az}=solar(24.15,120.67,d,8);const {Egh,Edir,cct}=daylight(el,wx);
  const rel=((az-bear+540)%360)-180,enters=el>3&&Math.abs(rel)<82&&Edir>1;
  const day=el>-1&&Egh>3;
  // 1) 天色 = 相機背景
  const sk=sky(el,wx);cam.camera.clearColor=new pc.Color(sk.bot[0]/255,sk.bot[1]/255,sk.bot[2]/255);
  // 2) 3DGS 畫面調色:亮度 + 暖冷 multiply + 直射暖暈 screen
  const B=day?Math.max(0.45,Math.min(1.1,0.5+Egh/130)):0.34;
  canvas.style.filter=`brightness(${B.toFixed(2)}) saturate(${day?1.06:0.9}) contrast(1.03)`;
  const cc=day?cct:3000; let tint,op;
  if(cc<5000){tint=[255,188,128];op=day?0.16+(5000-cc)/5000*0.22:0.36;}
  else{tint=[182,204,255];op=(cc-5000)/2000*0.18;}
  $('grade').style.background=`rgb(${tint[0]},${tint[1]},${tint[2]})`;$('grade').style.opacity=op;
  $('glow').style.opacity=enters?Math.min(0.42,Edir/120):0;
  $('sum').innerHTML=`太陽 仰角 <b>${el.toFixed(0)}°</b>·方位 <b>${az.toFixed(0)}°</b>（${dn(az)}） · ${el<=0?'<b>夜間</b>':enters?'<b style="color:#ffd34e">直射陽光☀</b>':'漫射'} · 室外≈<b>${Egh.toFixed(0)}</b>klux · 色溫≈<b>${(day?cct:3000).toFixed(0)}</b>K`;
}
let timer=null;
function setNow(){const n=new Date();/* 用本地日期(toISOString 是 UTC,台灣清晨會變成前一天) */$('date').value=n.getFullYear()+'-'+String(n.getMonth()+1).padStart(2,'0')+'-'+String(n.getDate()).padStart(2,'0');$('time').value=n.getHours()*60+n.getMinutes();render();}
['time','bear','wx','date'].forEach(id=>$(id).addEventListener('input',render));
$('nowBtn').onclick=()=>{if(timer){clearInterval(timer);timer=null;$('playBtn').textContent='▶ 一日';}setNow();};
$('playBtn').onclick=()=>{if(timer){clearInterval(timer);timer=null;$('playBtn').textContent='▶ 一日';return;}
  $('playBtn').textContent='⏸';timer=setInterval(()=>{$('time').value=(+$('time').value+8)%1440;render();},70);};
setNow();
</script></body></html>
